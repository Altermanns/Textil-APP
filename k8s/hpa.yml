apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: textil-app-hpa
  labels:
    app: textil-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: textil-app-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
