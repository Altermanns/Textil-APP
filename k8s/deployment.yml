apiVersion: apps/v1
kind: Deployment
metadata:
  name: textil-app-deployment
  labels:
    app: textil-app
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: textil-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: textil-app
        tier: web
    spec:
      containers:
        - name: textil-app
          image: textil-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: "LoginCRUD.settings.production"
            - name: DEBUG
              value: "False"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
